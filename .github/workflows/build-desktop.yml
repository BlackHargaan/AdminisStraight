name: Build desktop test releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run build:mac
            artifact: AdminisStraight-mac-unsigned
          - os: windows-latest
            command: npm run build:windows
            artifact: AdminisStraight-windows-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error
