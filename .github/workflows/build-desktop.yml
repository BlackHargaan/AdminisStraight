name: Build and release desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/workflows/build-desktop.yml', 'package*.json', 'desktop/**', 'ui/**', 'assets/**', 'tests/**']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run build:mac
            artifact: AdminisStraight-mac
            certificate_secret: MAC_CSC_LINK
            password_secret: MAC_CSC_KEY_PASSWORD
          - os: windows-latest
            command: npm run build:windows
            artifact: AdminisStraight-windows
            certificate_secret: WIN_CSC_LINK
            password_secret: WIN_CSC_KEY_PASSWORD
          - os: ubuntu-22.04
            command: npm run build:linux
            artifact: AdminisStraight-linux
            certificate_secret: LINUX_UNUSED_CERTIFICATE
            password_secret: LINUX_UNUSED_PASSWORD
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Release tag must match package.json version")'
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets[matrix.certificate_secret] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.password_secret] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.yml
            !release/builder-*.yml
            release/*.blockmap
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Validate packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'release/*arm64*.zip' >/dev/null
          compgen -G 'release/*mac.zip' >/dev/null
          compgen -G 'release/*.dmg' >/dev/null
          compgen -G 'release/*.exe' >/dev/null
          compgen -G 'release/*.AppImage' >/dev/null
          test -f release/latest-mac.yml
          test -f release/latest.yml
          test -f release/latest-linux.yml
          cd release
          sha256sum *.zip *.dmg *.exe *.AppImage > SHA256SUMS.txt
      - name: Publish cross-platform test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          export TAG="v$VERSION"
          RELEASE_ID="$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG) | .id')"
          if [[ -n "$RELEASE_ID" ]]; then
            DRAFT="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft')"
            if [[ "$DRAFT" != "true" ]]; then
              echo "Version already published; leaving its assets unchanged. Bump the version for a new release."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "AdminisStraight $VERSION — desktop test builds"
            RELEASE_ID="$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG) | .id')"
          fi
          cat > release-notes.md <<'NOTES'
          Desktop test builds for macOS, Windows, and Linux, including the persistent AM/PM display preference and Update app controls.

          Downloads:
          - macOS: Apple silicon (arm64) or Intel (x64) ZIP / DMG. Requires macOS 13 or later.
          - Windows: x64 NSIS setup executable.
          - Linux: x64 AppImage.

          Packaging and Node tests run on native GitHub-hosted runners for all three operating systems. Native interactive startup, installer and end-to-end update testing remain outstanding. Packages without signing credentials are unsigned and may be blocked by the operating system. Unsigned Mac apps require manual replacement.

          Export a planner backup before upgrading. Keep the existing user-data folder. Version 0.1.0 needs one manual upgrade before Update app becomes available. This test release is a prerelease: enable preview releases in Update app to check for it. The repository remains private; update checks require access to published assets.

          SHA256SUMS.txt contains installer checksums. Update metadata and blockmaps are attached alongside the packages.
          NOTES
          gh release upload "$TAG" release/* --clobber
          STALE_ID="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "release-upload-check.txt") | .id')"
          if [[ -n "$STALE_ID" ]]; then gh api --method DELETE "repos/$GH_REPO/releases/assets/$STALE_ID"; fi
          gh release edit "$TAG" --title "AdminisStraight $VERSION — desktop test builds" --notes-file release-notes.md --draft=false --prerelease --latest=false
